name: Build IDT Tool Inventory APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP=$(find . -type f -iname "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found"
            exit 1
          fi

          echo "Found: $ZIP"
          echo "ZIP=$ZIP" >> $GITHUB_ENV

      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -o "$ZIP" -d extracted

      - name: Find Android project
        run: |
          SETTINGS=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "Android project not found"
            find extracted -type f
            exit 1
          fi

          PROJECT=$(dirname "$SETTINGS")

          echo "Project: $PROJECT"
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build
        working-directory: ${{ env.PROJECT }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IDT-Tool-Inventory-App
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
