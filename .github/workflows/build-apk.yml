name: Build IDT Tool Inventory APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # Find the uploaded project ZIP
      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          echo "Repository files:"
          find . -maxdepth 2 -type f -print

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No project ZIP found."
            exit 1
          fi

          ZIP=$(basename "$ZIP")

          echo "Using ZIP: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      # Extract project
      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          echo "Extraction complete."

          find extracted -maxdepth 5 -type f -print | head -300

      # Find Android project
      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            find extracted -maxdepth 7 -type f -print
            exit 1
          fi

          PROJECT=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      # Show actual project structure
      - name: Show project files
        shell: bash
        run: |
          set -e

          echo "PROJECT = $PROJECT"
          echo ""

          find "$PROJECT" -maxdepth 6 -type f -print

      # Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Install Gradle directly
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Verify Gradle
      - name: Check Gradle
        shell: bash
        run: |
          set -e

          echo "Gradle version:"
          gradle --version

      # Check Android project
      - name: Check Android project
        shell: bash
        working-directory: ${{ env.PROJECT }}
        run: |
          set -e

          echo "Checking Android project..."

          if [ ! -d "app" ]; then
            echo "ERROR: app folder not found."
            exit 1
          fi

          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: Root build.gradle/build.gradle.kts not found."
            exit 1
          fi

          echo "Android project structure OK."

      # Android SDK
      - name: Check Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager --list_installed | head -100 || true

      # Install Android SDK
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # Build APK
      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT }}
        run: |
          set -e

          echo "Starting Android build..."

          gradle clean assembleDebug --stacktrace

      # Find APK
      - name: Find APK
        shell: bash
        working-directory: ${{ env.PROJECT }}
        run: |
          set -e

          echo "Searching for APK..."

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."

            echo "Build files:"
            find . -type f | sort

            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      # Prepare APK
      - name: Prepare APK
        shell: bash
        working-directory: ${{ env.PROJECT }}
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-output/IDT-Tool-Inventory.apk"

          ls -lh "$GITHUB_WORKSPACE/apk-output/IDT-Tool-Inventory.apk"

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IDT-Tool-Inventory-APK
          path: apk-output/IDT-Tool-Inventory.apk
          if-no-files-found: error
