name: Build IDT Tool Inventory APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find inventory ZIP
        shell: bash
        run: |
          set -e

          echo "Files in repository:"
          find . -maxdepth 2 -type f -print

          ZIP=$(find . -maxdepth 2 -type f -name 'IDT-Tool-Inventory-Full-Rebuilt.zip' | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: IDT-Tool-Inventory-Full-Rebuilt.zip was not found."
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Check ZIP
        shell: bash
        run: |
          set -e

          echo "Testing ZIP:"
          unzip -t "$ZIP_PATH"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_PATH" -d extracted

          echo "Extracted project:"
          find extracted -maxdepth 3 -type f | head -200

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project was not found."
            echo "The ZIP must contain settings.gradle or settings.gradle.kts."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show Android project
        shell: bash
        run: |
          set -e

          echo "Project contents:"
          find "$PROJECT_DIR" -maxdepth 3 -type f -print

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=""

          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" \
              -type f \
              -name sdkmanager \
              | head -1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager could not be found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Make Gradle executable
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
          else
            echo "ERROR: gradlew was not found."
            echo "The Android project must contain the Gradle wrapper."
            exit 1
          fi

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          ./gradlew clean assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p output
          cp "$APK" output/IDT-Tool-Inventory.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IDT-Tool-Inventory-APK
          path: output/IDT-Tool-Inventory.apk
          if-no-files-found: error
