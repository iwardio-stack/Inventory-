name: Build IDT Tool Inventory APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract full project
        shell: bash
        run: |
          set -e
          ZIP=$(find . -type f -name "IDT-Tool-Inventory-Full.zip" | head -1)
          test -n "$ZIP"
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP" -d extracted

      - name: Locate Android project
        shell: bash
        run: |
          set -e
          SETTINGS=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          test -n "$SETTINGS"
          PROJECT=$(dirname "$SETTINGS")
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          test -d "$PROJECT/app"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT }}
        run: |
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IDT-Tool-Inventory-APK
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
